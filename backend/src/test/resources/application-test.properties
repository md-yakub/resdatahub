spring.datasource.url=jdbc:h2:mem:resdatahub;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;NON_KEYWORDS=VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop

resdatahub.public-base-url=http://localhost:8080
resdatahub.minio.endpoint=http://localhost:9000
resdatahub.minio.access-key=test-access-key
resdatahub.minio.secret-key=test-secret-key
resdatahub.minio.bucket=test-bucket
