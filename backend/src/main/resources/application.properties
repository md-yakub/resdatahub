spring.application.name=resdatahub

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

management.endpoint.health.enabled=true
management.endpoints.web.exposure.include=health

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.show-actuator=false

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

resdatahub.storage.max-file-size-bytes=52428800
resdatahub.public-base-url=${RESDATAHUB_PUBLIC_BASE_URL}
resdatahub.cors.allowed-origins=${RESDATAHUB_CORS_ALLOWED_ORIGINS:http://localhost:3000}
resdatahub.catalog.title=${RESDATAHUB_CATALOG_TITLE:ResDataHub Catalog}
resdatahub.catalog.description=${RESDATAHUB_CATALOG_DESCRIPTION:Catalog of published ResDataHub dataset versions.}
resdatahub.catalog.publisher-name=${RESDATAHUB_CATALOG_PUBLISHER_NAME:ResDataHub}
resdatahub.catalog.publisher-uri=${RESDATAHUB_CATALOG_PUBLISHER_URI:}
resdatahub.catalog.homepage=${RESDATAHUB_CATALOG_HOMEPAGE:}
resdatahub.catalog.language=${RESDATAHUB_CATALOG_LANGUAGE:en}
resdatahub.catalog.issued=${RESDATAHUB_CATALOG_ISSUED:2026-01-01T00:00:00Z}
resdatahub.catalog.contact=${RESDATAHUB_CATALOG_CONTACT:}
